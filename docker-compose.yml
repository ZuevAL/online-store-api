services:
  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
